name: ExploreOS cloud checks
on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'cloud/**'
      - 'scripts/cloud/**'
      - 'scripts/*.py'
      - 'scripts/*.mjs'
      - 'scripts/*.cjs'
      - 'explore/**'
      - 'tests/**'
      - 'examples/open-exploration/**'
      - 'examples/feedback/**'
      - 'examples/evaluation/**'
      - '.github/workflows/cloud-bootstrap.yml'
      - '.github/workflows/release.yml'
      - '.release/**'
      - 'docs/releases/**'
  pull_request:
    paths:
      - 'cloud/**'
      - 'scripts/cloud/**'
      - 'scripts/*.py'
      - 'scripts/*.mjs'
      - 'scripts/*.cjs'
      - 'explore/**'
      - 'tests/**'
      - 'examples/open-exploration/**'
      - 'examples/feedback/**'
      - 'examples/evaluation/**'
      - '.github/workflows/cloud-bootstrap.yml'
      - '.github/workflows/release.yml'
      - '.release/**'
      - 'docs/releases/**'
permissions:
  contents: read
concurrency:
  group: cloud-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  upstream-api:
    runs-on: ubuntu-24.04
    env:
      EXPLORE_FRONTEND: '0'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check shell syntax
        run: bash -n scripts/cloud/setup.sh scripts/cloud/setup_pi.sh scripts/cloud/setup_claude.sh scripts/cloud/setup_subagents.sh
      - name: Install audited upstream runtime
        run: bash scripts/cloud/setup.sh
      - name: Install pinned Pi libraries without model calls
        run: bash scripts/cloud/setup_pi.sh
      - name: Install pinned subagent plugin host without model calls
        run: bash scripts/cloud/setup_subagents.sh
      - name: Check Python and native extension syntax
        run: |
          .venv/bin/python -m compileall -q scripts explore tests
          node --check cloud/native/exploreos.cjs
          node --check explore/web/app.js
          node --check scripts/check_native_ui.cjs
      - name: Check transaction rollback, concurrent files and bounded execution mechanics
        run: |
          node scripts/cloud/test_atomic_files.cjs
          .venv/bin/python -m unittest discover -s scripts/cloud -p 'test_*.py' -v
      - name: Start authenticated development service
        run: .venv/bin/python scripts/cloud/runtime.py start
      - name: Exercise upstream API without model calls
        run: |
          .venv/bin/python scripts/cloud/smoke.py seed
          .venv/bin/python scripts/cloud/m0.py seed
          .venv/bin/python -m unittest discover -s tests -v
      - name: Gracefully stop service
        run: .venv/bin/python scripts/cloud/runtime.py stop
      - name: Restart and verify saved fixture
        run: |
          .venv/bin/python scripts/cloud/runtime.py start
          .venv/bin/python scripts/cloud/smoke.py verify
          .venv/bin/python scripts/cloud/m0.py verify
      - name: Verify private cold backup and isolated database restore
        run: .venv/bin/python scripts/cloud/verify_backup.py
      - name: Install pinned browser test runner
        run: |
          npm install --prefix .runtime/browser --no-audit --no-fund --save-exact playwright@1.56.1
          .runtime/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise real browser workflows without model calls
        run: |
          .venv/bin/python scripts/cloud/runtime.py stop
          EXPLORE_FRONTEND=1 .venv/bin/python scripts/cloud/runtime.py start
          node scripts/check_native_ui.cjs
      - name: Retain public demonstration screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exploreos-browser-previews-${{ github.sha }}
          path: .runtime/native-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Stop owned service
        if: always()
        run: |
          if [ -x .venv/bin/python ]; then
            .venv/bin/python scripts/cloud/runtime.py stop
          fi
