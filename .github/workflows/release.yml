name: ExploreOS release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install acceptance-check dependencies without model execution
        run: python -m pip install -r cloud/requirements.txt
      - name: Require actual recorded acceptance and successful same-commit main builds
        id: gate
        run: python scripts/cloud/release_gate.py --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --github-checks --github-output "$GITHUB_OUTPUT"
      - name: Download the exact verified product artifact
        env:
          PRODUCT_RUN: ${{ steps.gate.outputs.run_id }}
          PRODUCT_ARTIFACT: ${{ steps.gate.outputs.artifact_name }}
        run: gh run download "$PRODUCT_RUN" --repo "$RELEASE_REPOSITORY" --name "$PRODUCT_ARTIFACT" --dir .runtime/release
      - name: Verify source binding and bundle checksums
        run: |
          set -euo pipefail
          mkdir .runtime/release/verify
          tar -xzf .runtime/release/exploreos-linux-amd64.tar.gz -C .runtime/release/verify
          test "$(cat .runtime/release/verify/SOURCE_COMMIT.txt)" = "$(git rev-parse HEAD)"
          (cd .runtime/release/verify && sha256sum -c SHA256SUMS)
          mv .runtime/release/exploreos-linux-amd64.tar.gz ".runtime/release/exploreos-linux-amd64-$RELEASE_TAG.tar.gz"
          (cd .runtime/release && sha256sum "exploreos-linux-amd64-$RELEASE_TAG.tar.gz" > SHA256SUMS)
      - name: Prepare an unpublished release and upload verified assets
        run: gh release create "$RELEASE_TAG" ".runtime/release/exploreos-linux-amd64-$RELEASE_TAG.tar.gz" .runtime/release/SHA256SUMS --draft --repo "$RELEASE_REPOSITORY" --verify-tag --title "ExploreOS $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
      - name: Verify the uploaded release assets before publication
        run: |
          set -euo pipefail
          gh api "repos/$RELEASE_REPOSITORY/releases/tags/$RELEASE_TAG" > .runtime/release/remote.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('.runtime/release/remote.json').read_text())
          tag = os.environ['RELEASE_TAG']
          assert release['draft'] and release['tag_name'] == tag
          expected = {name: (Path('.runtime/release') / name).stat().st_size for name in
                      (f'exploreos-linux-amd64-{tag}.tar.gz', 'SHA256SUMS')}
          actual = {asset['name']: asset['size'] for asset in release['assets']}
          assert actual == expected, 'Uploaded release assets differ from the verified local files'
          PY
      - name: Publish the complete accepted release
        run: gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --draft=false --latest
