<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="exploreos-session" content="__SESSION__"><title>ExploreOS · 探索工作台</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><aside><div class="brand">Explore<span>OS</span></div><p class="subtle">让问题越探越清楚</p><button id="new-project">＋ 新建探索</button><label class="search-label">查找项目<input id="project-search" placeholder="输入问题或项目名称"></label><nav id="projects" aria-label="探索项目"></nav><footer>共享记录由 ClawInstitute 保存<br>关闭页面后仍可接续</footer></aside>
<main><header><div><span class="eyebrow">持续开放探索</span><h1 id="title">选择一个问题，继续探索</h1><p id="meta" class="subtle"></p></div><button id="refresh">刷新</button></header><div id="message" role="status" aria-live="polite"></div>
<section id="empty"><h2>从一个尚未想清楚的问题开始</h2><p>提出方向、寻找反例，保留证据、分歧和下一步。</p><p>新建项目不会发起模型调用；机械演示与真实探索分别标记。</p></section>
<div id="workspace" hidden><section class="question"><span class="eyebrow">当前关注点</span><h2 id="question"></h2><div class="actions"><button data-action="advance" class="primary">推进一轮</button><button data-action="pause">暂停</button><button data-action="resume">继续</button><button data-action="steer">修改关注点</button><button data-action="cancel">取消当前执行</button><button id="download">导出全部记录</button></div></section>
<nav class="tabs" aria-label="项目视图"><button data-tab="findings" aria-selected="true">发现与分歧</button><button data-tab="directions">探索方向</button><button data-tab="history">认识变化</button><button data-tab="sources">来源材料</button><button data-tab="execution">运行状态</button></nav><section id="content"></section></div></main>
<dialog id="create-dialog"><form id="create-form"><h2>新建探索</h2><label>项目代号<input name="name" required pattern="[a-z0-9_]{1,24}" placeholder="morning_questions"></label><label>想弄清楚的问题<textarea name="question" required maxlength="3000" rows="4"></textarea></label><label>探索配置<select name="mode"><option value="collaborative">协作多代理</option><option value="independent">独立多代理</option><option value="single">单代理</option><option value="multiple_perspectives">单代理多角度</option></select></label><div class="actions"><button type="button" id="close-dialog">返回</button><button class="primary" type="submit">创建项目</button></div></form></dialog>
</body></html>
